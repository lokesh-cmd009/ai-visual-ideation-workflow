<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Template 1: Square Feed (1:1) -->
  <g transform="translate(40, 20)" filter="url(#shadow)">
    <rect width="240" height="240" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Top badge -->
    <rect x="20" y="20" width="70" height="14" rx="4" fill="#38BDF8" opacity="0.3"/>
    <!-- Headline -->
    <rect x="20" y="44" width="150" height="18" rx="4" fill="#F8FAFC"/>
    <rect x="20" y="68" width="100" height="10" rx="3" fill="#94A3B8"/>
    <!-- Central Hero Asset -->
    <rect x="30" y="90" width="180" height="90" rx="8" fill="#334155" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="120" y="140" fill="#A78BFA" font-family="monospace" font-size="11" text-anchor="middle">[AI Hero Asset]</text>
    <!-- CTA Button -->
    <rect x="20" y="195" width="200" height="28" rx="6" fill="#10B981"/>
    <text x="120" y="213" fill="#000" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">PRIMARY CTA →</text>
    <text x="120" y="275" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Instagram Feed (1:1)</text>
  </g>

  <!-- Template 2: Vertical Story (9:16) -->
  <g transform="translate(350, 20)" filter="url(#shadow)">
    <rect width="160" height="260" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Top Hook -->
    <rect x="15" y="20" width="130" height="24" rx="4" fill="#F8FAFC"/>
    <rect x="15" y="50" width="90" height="8" rx="3" fill="#94A3B8"/>
    <!-- Center Dynamic Hero -->
    <rect x="15" y="70" width="130" height="120" rx="8" fill="#334155" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="80" y="135" fill="#A78BFA" font-family="monospace" font-size="10" text-anchor="middle">[9:16 Hero]</text>
    <!-- Bottom Thumb CTA -->
    <rect x="15" y="205" width="130" height="28" rx="6" fill="#10B981"/>
    <text x="80" y="223" fill="#000" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">SWIPE UP / TAP</text>
    <text x="80" y="295" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Story & Reel (9:16)</text>
  </g>

  <!-- Template 3: Landscape Display (1.91:1) -->
  <g transform="translate(580, 50)" filter="url(#shadow)">
    <rect width="280" height="150" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Left Column: Copy & CTA -->
    <rect x="20" y="25" width="120" height="18" rx="4" fill="#F8FAFC"/>
    <rect x="20" y="50" width="90" height="8" rx="3" fill="#94A3B8"/>
    <rect x="20" y="65" width="110" height="8" rx="3" fill="#94A3B8"/>
    <rect x="20" y="95" width="110" height="26" rx="6" fill="#10B981"/>
    <text x="75" y="112" fill="#000" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">LEARN MORE</text>
    <!-- Right Column: Visual Hero -->
    <rect x="150" y="20" width="110" height="110" rx="8" fill="#334155" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="205" y="80" fill="#A78BFA" font-family="monospace" font-size="9" text-anchor="middle">[Landscape Hero]</text>
    <text x="140" y="185" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Display Banner (1.91:1)</text>
  </g>
</svg>
