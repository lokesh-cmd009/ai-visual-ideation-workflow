<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Flow Connector Lines -->
  <line x1="200" y1="120" x2="260" y2="120" stroke="#334155" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="420" y1="120" x2="480" y2="120" stroke="#334155" stroke-width="3" stroke-dasharray="6 4"/>
  <line x1="640" y1="120" x2="700" y2="120" stroke="#334155" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Step 1: Prompt Formula -->
  <g transform="translate(40, 40)" filter="url(#cardShadow)">
    <rect width="160" height="160" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="80" cy="45" r="22" fill="url(#stepGrad1)"/>
    <text x="80" y="52" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">1</text>
    <text x="80" y="95" fill="#F8FAFC" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Prompt Formula</text>
    <text x="80" y="120" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Taxonomy & Rules</text>
    <text x="80" y="138" fill="#38BDF8" font-family="monospace" font-size="9" text-anchor="middle">5-Tier Structure</text>
  </g>

  <!-- Step 2: Generative Model -->
  <g transform="translate(260, 40)" filter="url(#cardShadow)">
    <rect width="160" height="160" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="80" cy="45" r="22" fill="url(#stepGrad2)"/>
    <text x="80" y="52" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">2</text>
    <text x="80" y="95" fill="#F8FAFC" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Kaggle AI Models</text>
    <text x="80" y="120" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Rapid Style Iteration</text>
    <text x="80" y="138" fill="#A78BFA" font-family="monospace" font-size="9" text-anchor="middle">Seed / CFG Lock</text>
  </g>

  <!-- Step 3: Modular Layout -->
  <g transform="translate(480, 40)" filter="url(#cardShadow)">
    <rect width="160" height="160" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="80" cy="45" r="22" fill="url(#stepGrad3)"/>
    <text x="80" y="52" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">3</text>
    <text x="80" y="95" fill="#F8FAFC" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Figma & Canva</text>
    <text x="80" y="120" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Modular Assembly</text>
    <text x="80" y="138" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">-40% Production Time</text>
  </g>

  <!-- Step 4: High-Converting Ads -->
  <g transform="translate(700, 40)" filter="url(#cardShadow)">
    <rect width="160" height="160" rx="16" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="80" cy="45" r="22" fill="url(#stepGrad4)"/>
    <text x="80" y="52" fill="#000" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">4</text>
    <text x="80" y="95" fill="#F8FAFC" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">A/B Testing Deploy</text>
    <text x="80" y="120" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Multivariate CTAs</text>
    <text x="80" y="138" fill="#00F0FF" font-family="monospace" font-size="9" text-anchor="middle">Optimized CTR</text>
  </g>
</svg>
